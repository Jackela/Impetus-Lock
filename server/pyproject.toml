[tool.poetry]
name = "impetus-lock-server"
version = "0.1.0"
description = "FastAPI backend for Impetus Lock"
authors = ["Impetus Team <team@impetus-lock.dev>"]
readme = "README.md"
packages = [{include = "server"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.131.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
pydantic = "^2.9.0"
instructor = "^1.4.0"
httpx = "^0.27.0"
anthropic = "^0.37.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.44"}
asyncpg = "^0.30.0"
alembic = "^1.17.1"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp-proto-http = "^1.27.0"
prometheus-client = "^0.24.1"
python-dotenv = "^1.0.1"
tenacity = "^9.1.4"
cryptography = "^42.0.0"
pyjwt = "^2.8.0"
itsdangerous = "^2.1.2"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.8.0"
mypy = "^1.11.0"
types-requests = "^2.32.0"
types-passlib = "^1.7.4"
import-linter = "^2.0"
hypothesis = "^6.147.0"
pydocstyle = "^6.3.0"
pytest-asyncio = "^1.3.0"
aiosqlite = "^0.22.1"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "verify_db.py",
    "check_tables.py",
    "create_migration.py",
    "run_alembic_revision.py",
    "run_alembic_upgrade.py",
    "start_server_test.py",
    "run_server.py",
    "alembic/",
    ".venv*/",
    ".venv.windows*/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "T20", "SIM"]
ignore = ["B008"]  # B008: FastAPI Depends() is safe to use as default

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = [
    "verify_db\\.py$",
    "check_tables\\.py$",
    "create_migration\\.py$",
    "run_alembic_revision\\.py$",
    "run_alembic_upgrade\\.py$",
    "start_server_test\\.py$",
    "run_server\\.py$",
    "alembic/",
]

[[tool.mypy.overrides]]
module = ["instructor"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jwt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis", "redis.asyncio", "redis.asyncio.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pydocstyle]
# Google-style docstrings per Article V (Documentation)
convention = "google"
# Skip test files (test_ prefix)
match = "(?!test_).*\\.py"
# Skip __init__.py files
match_dir = "(?!tests).*"

# import-linter configuration - ENABLED
# Enforces Clean Architecture dependency rules
# See ARCHITECTURE_GUARDS.md for detailed documentation

[tool.importlinter]
root_package = "server"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture: Domain Layer Independence"
type = "forbidden"
source_modules = ["server.domain"]
forbidden_modules = [
    "server.application",
    "server.infrastructure",
    "server.api",
]

[[tool.importlinter.contracts]]
name = "Clean Architecture: Application Layer Dependencies"
type = "forbidden"
source_modules = ["server.application"]
forbidden_modules = [
    "server.api",
    "server.infrastructure",
]
# Observability imports are temporarily allowed for practical logging needs
# TODO: Refactor to use domain-layer observability abstractions (see domain/observability.py)
ignore_imports = [
    "server.application.services.intervention_service -> server.infrastructure.observability.tracing",
]

[[tool.importlinter.contracts]]
name = "Clean Architecture: Infrastructure Layer Dependencies"
type = "forbidden"
source_modules = ["server.infrastructure"]
forbidden_modules = [
    "server.api",
]

# Note: layers contract temporarily disabled due to import-linter behavior
# The forbidden contracts above provide sufficient architecture enforcement
# [[tool.importlinter.contracts]]
# name = "Clean Architecture: API Layer (Outermost)"
# type = "layers"
# layers = [
#     "api",
#     "application",
#     "domain",
# ]
# containers = ["server"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
