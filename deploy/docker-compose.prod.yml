name: ${DEPLOY_PROJECT:?set DEPLOY_PROJECT}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    image: ${API_IMAGE:?supply the immutable API_IMAGE digest}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_ENV: production
      API_WORKERS: ${API_WORKERS:-2}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_SESSION_SECRET: ${WECHAT_SESSION_SECRET:-}
      WECHAT_STORY_BASE_URL: ${WECHAT_STORY_BASE_URL:-}
      WECHAT_STORY_MODEL: ${WECHAT_STORY_MODEL:-}
      WECHAT_STORY_API_KEY: ${WECHAT_STORY_API_KEY:-}
    networks:
      default:
        aliases:
          - backend
  client:
    image: ${CLIENT_IMAGE:?supply the immutable CLIENT_IMAGE digest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${CLIENT_BIND:-127.0.0.1}:${CLIENT_PORT:-8080}:80"
  redis:
    image: redis:8-alpine
    restart: unless-stopped

volumes:
  postgres-data:
