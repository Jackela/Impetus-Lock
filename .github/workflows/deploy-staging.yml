name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to deploy"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_REGISTRY: ghcr.io
  DOCKER_NAMESPACE: ${{ github.repository_owner }}

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      client_image: ${{ steps.meta.outputs.client_image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        run: |
          VERSION=sha-$(git rev-parse --short HEAD)
          NAMESPACE=$(printf '%s' "$DOCKER_NAMESPACE" | tr '[:upper:]' '[:lower:]')
          {
          echo "version=$VERSION"
          echo "api_image=$DOCKER_REGISTRY/$NAMESPACE/impetus-api"
          echo "client_image=$DOCKER_REGISTRY/$NAMESPACE/impetus-client"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.api_image }}:staging
            ${{ steps.meta.outputs.api_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            POETRY_VERSION=1.8.5

      - name: Build and push Client image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.client_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.client_image }}:staging
            ${{ steps.meta.outputs.client_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.STAGING_VITE_API_URL || '/api' }}

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup SSH
        if: ${{ env.STAGING_HOST != '' && env.STAGING_SSH_KEY != '' }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        id: deploy
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_DIR: ${{ secrets.STAGING_DEPLOY_DIR || '/opt/impetus-lock' }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}:${{ needs.build-and-push.outputs.version }}
          CLIENT_IMAGE: ${{ needs.build-and-push.outputs.client_image }}:${{ needs.build-and-push.outputs.version }}
        run: |
          echo "deployed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$STAGING_HOST" ]; then
            echo "Remote staging deployment is not configured; images only."
            echo "url=https://github.com/${{ github.repository }}/packages" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "::error::STAGING_USER and STAGING_SSH_KEY are required when STAGING_HOST is set"
            exit 1
          fi
          # Use the existing deployment implementation with the server's compose/env files.
          scp -o StrictHostKeyChecking=no scripts/deploy-staging.sh "$STAGING_USER@$STAGING_HOST:/tmp/impetus-deploy-staging.sh"
          printf -v remote_command 'DEPLOY_DIR=%q API_IMAGE=%q CLIENT_IMAGE=%q bash /tmp/impetus-deploy-staging.sh --deploy-only' "$DEPLOY_DIR" "$API_IMAGE" "$CLIENT_IMAGE"
          ssh -o StrictHostKeyChecking=no "$STAGING_USER@$STAGING_HOST" "$remote_command"
          {
            echo "deployed=true"
            echo "url=http://$STAGING_HOST"
          } >> "$GITHUB_OUTPUT"

  health-check:
    name: Health Checks
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: needs.deploy-staging.result == 'success' && needs.deploy-staging.outputs.deployed == 'true'
    steps:
      - name: Wait for services
        run: sleep 30

      - name: API Health Check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          HOST="${STAGING_HOST:?STAGING_HOST is required for a deployed environment}"
          echo "Checking API health at http://${HOST}:8000/health"
          curl -sf "http://${HOST}:8000/health" || exit 1
          echo "✅ API is healthy"

      - name: Database Health Check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          HOST="${STAGING_HOST:?STAGING_HOST is required for a deployed environment}"
          echo "Checking database health at http://${HOST}:8000/health/db"
          curl -sf "http://${HOST}:8000/health/db" || exit 1
          echo "✅ Database is healthy"

      - name: Client Health Check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          HOST="${STAGING_HOST:?STAGING_HOST is required for a deployed environment}"
          echo "Checking client health at http://${HOST}/health"
          curl -sf "http://${HOST}/health" || exit 1
          echo "✅ Client is healthy"

  notify:
    name: Notify
    needs: [build-and-push, deploy-staging, health-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          {
          echo "## Staging Deployment Summary"
          echo ""
          echo "- **Version:** ${{ needs.build-and-push.outputs.version }}"
          echo "- **API Image:** ${{ needs.build-and-push.outputs.api_image }}:${{ needs.build-and-push.outputs.version }}"
          echo "- **Client Image:** ${{ needs.build-and-push.outputs.client_image }}:${{ needs.build-and-push.outputs.version }}"
          echo ""

          echo "- **Remote deployment:** ${{ needs.deploy-staging.outputs.deployed || 'false' }}"
          if [ "${{ needs.health-check.result }}" == "success" ]; then
            echo "✅ **Health Checks:** PASSED"
          elif [ "${{ needs.deploy-staging.outputs.deployed }}" == "false" ] && [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "⚠️ **Health Checks:** SKIPPED (remote deployment not configured)"
          else
            echo "❌ **Deployment or Health Checks:** FAILED"
          fi

          } >> "$GITHUB_STEP_SUMMARY"
