name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to deploy"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_REGISTRY: ghcr.io
  DOCKER_NAMESPACE: ${{ github.repository_owner }}

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      client_image: ${{ steps.meta.outputs.client_image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        run: |
          VERSION=sha-$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "api_image=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/impetus-api" >> $GITHUB_OUTPUT
          echo "client_image=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/impetus-client" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.api_image }}:staging
            ${{ steps.meta.outputs.api_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            POETRY_VERSION=1.8.5

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.client_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.client_image }}:staging
            ${{ steps.meta.outputs.client_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.STAGING_VITE_API_URL || '/api' }}

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup SSH
        if: ${{ secrets.STAGING_SSH_KEY != '' }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        id: deploy
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_DIR: ${{ secrets.STAGING_DEPLOY_DIR || '/opt/impetus-lock' }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}:${{ needs.build-and-push.outputs.version }}
          CLIENT_IMAGE: ${{ needs.build-and-push.outputs.client_image }}:${{ needs.build-and-push.outputs.version }}
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "⚠️ STAGING_HOST not set - skipping remote deployment"
            echo "Images have been pushed to registry. Manual deployment required."
            echo "url=https://github.com/${{ github.repository }}/packages" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🚀 Deploying to staging server: $STAGING_HOST"

          # Create deployment script
          cat > deploy.sh << 'EOF'
          set -e
          cd ${{ env.DEPLOY_DIR }}

          # Pull latest images
          echo "📦 Pulling images..."
          docker pull ${{ env.API_IMAGE }}
          docker pull ${{ env.CLIENT_IMAGE }}

          # Update docker-compose with new images
          export API_IMAGE=${{ env.API_IMAGE }}
          export CLIENT_IMAGE=${{ env.CLIENT_IMAGE }}

          # Stop existing containers gracefully
          echo "🛑 Stopping existing containers..."
          docker-compose -f docker-compose.prod.yml down --timeout 30

          # Start services
          echo "▶️ Starting services..."
          docker-compose -f docker-compose.prod.yml up -d

          # Wait for services
          sleep 15

          # Health checks
          echo "🏥 Running health checks..."
          curl -sf http://localhost:8000/health || exit 1
          curl -sf http://localhost/health || exit 1

          echo "✅ Deployment successful!"
          EOF

          # Copy and execute deployment script
          scp -o StrictHostKeyChecking=no deploy.sh ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:/tmp/
          ssh -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} 'bash /tmp/deploy.sh'

          echo "url=http://${{ env.STAGING_HOST }}" >> $GITHUB_OUTPUT

  health-check:
    name: Health Checks
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: always() && needs.deploy-staging.result == 'success'
    steps:
      - name: Wait for services
        run: sleep 30

      - name: API Health Check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          HOST="${STAGING_HOST:-localhost}"
          echo "Checking API health at http://${HOST}:8000/health"
          curl -sf "http://${HOST}:8000/health" || exit 1
          echo "✅ API is healthy"

      - name: Database Health Check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          HOST="${STAGING_HOST:-localhost}"
          echo "Checking database health at http://${HOST}:8000/health/db"
          curl -sf "http://${HOST}:8000/health/db" || exit 1
          echo "✅ Database is healthy"

      - name: Client Health Check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          HOST="${STAGING_HOST:-localhost}"
          echo "Checking client health at http://${HOST}/health"
          curl -sf "http://${HOST}/health" || exit 1
          echo "✅ Client is healthy"

  notify:
    name: Notify
    needs: [build-and-push, deploy-staging, health-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Image:** ${{ needs.build-and-push.outputs.api_image }}:${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Client Image:** ${{ needs.build-and-push.outputs.client_image }}:${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.health-check.result }}" == "success" ]; then
            echo "✅ **Health Checks:** PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.health-check.result }}" == "skipped" ]; then
            echo "⚠️ **Health Checks:** SKIPPED (remote deployment not configured)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Health Checks:** FAILED" >> $GITHUB_STEP_SUMMARY
          fi
