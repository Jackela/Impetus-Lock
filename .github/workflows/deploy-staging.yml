name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to deploy"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_REGISTRY: ghcr.io
  DOCKER_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      api_image: ${{ steps.release.outputs.api_image }}
      client_image: ${{ steps.release.outputs.client_image }}
    steps:
      - name: Resolve and check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build source
        id: meta
        run: |
          SOURCE_SHA=$(git rev-parse --verify HEAD)
          NAMESPACE=$(printf '%s' "$DOCKER_NAMESPACE" | tr '[:upper:]' '[:lower:]')
          {
            echo "source_sha=$SOURCE_SHA"
            echo "api_repository=$DOCKER_REGISTRY/$NAMESPACE/impetus-api"
            echo "client_repository=$DOCKER_REGISTRY/$NAMESPACE/impetus-client"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          labels: org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
          tags: |
            ${{ steps.meta.outputs.api_repository }}:sha-${{ steps.meta.outputs.source_sha }}
            ${{ steps.meta.outputs.api_repository }}:staging
            ${{ steps.meta.outputs.api_repository }}:latest
          cache-from: type=gha,scope=staging-api
          cache-to: type=gha,scope=staging-api,mode=max

      - name: Build and push Client image
        id: client
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          labels: org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
          tags: |
            ${{ steps.meta.outputs.client_repository }}:sha-${{ steps.meta.outputs.source_sha }}
            ${{ steps.meta.outputs.client_repository }}:staging
            ${{ steps.meta.outputs.client_repository }}:latest
          cache-from: type=gha,scope=staging-client
          cache-to: type=gha,scope=staging-client,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.STAGING_VITE_API_URL || '/api' }}

      - name: Record immutable release
        id: release
        env:
          API_REPOSITORY: ${{ steps.meta.outputs.api_repository }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          CLIENT_REPOSITORY: ${{ steps.meta.outputs.client_repository }}
          CLIENT_DIGEST: ${{ steps.client.outputs.digest }}
        run: |
          [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$CLIENT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo "api_image=$API_REPOSITORY@$API_DIGEST"
            echo "client_image=$CLIENT_REPOSITORY@$CLIENT_DIGEST"
          } >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      public_url: ${{ steps.deploy.outputs.public_url }}
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.public_url }}
    steps:
      - name: Check out the built revision
        if: env.STAGING_HOST != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-and-push.outputs.source_sha }}

      - name: Setup SSH
        if: env.STAGING_HOST != '' && env.STAGING_SSH_KEY != ''
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        id: deploy
        env:
          DEPLOY_DIR: ${{ secrets.STAGING_DEPLOY_DIR || '/opt/impetus-lock' }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          CLIENT_IMAGE: ${{ needs.build-and-push.outputs.client_image }}
          RELEASE_SHA: ${{ needs.build-and-push.outputs.source_sha }}
          PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
        run: |
          if [[ -z "$STAGING_HOST" ]]; then
            echo "Remote staging deployment is not configured; images only."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$STAGING_USER" || -z "$STAGING_SSH_KEY" ]]; then
            echo "::error::STAGING_USER and STAGING_SSH_KEY are required when STAGING_HOST is set"
            exit 1
          fi
          host="$STAGING_USER@$STAGING_HOST"
          remote_dir=$(ssh -o StrictHostKeyChecking=accept-new -- "$host" 'mktemp -d /tmp/impetus-deploy.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/impetus-deploy\.[[:alnum:]]+$ ]]
          trap 'ssh -- "$host" "rm -r -- $remote_dir" || true' EXIT
          scp -- scripts/deployment.py "$host:$remote_dir/"
          printf -v remote_command 'DEPLOY_DIR=%q API_IMAGE=%q CLIENT_IMAGE=%q RELEASE_SHA=%q python3 %q staging deploy' \
            "$DEPLOY_DIR" "$API_IMAGE" "$CLIENT_IMAGE" "$RELEASE_SHA" "$remote_dir/deployment.py"
          ssh -- "$host" "$remote_command"
          {
            echo "deployed=true"
            echo "public_url=$PUBLIC_URL"
          } >> "$GITHUB_OUTPUT"

  health-check:
    name: Public Health Checks
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.deploy-staging.outputs.deployed == 'true' && needs.deploy-staging.outputs.public_url != ''
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-and-push.outputs.source_sha }}

      - name: Check client, API, and database via public origin
        env:
          PUBLIC_URL: ${{ needs.deploy-staging.outputs.public_url }}
        run: python3 scripts/deployment.py staging check-ready --url "$PUBLIC_URL"

  notify:
    name: Notify
    needs: [build-and-push, deploy-staging, health-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Deployment Summary
        env:
          SOURCE_SHA: ${{ needs.build-and-push.outputs.source_sha }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          CLIENT_IMAGE: ${{ needs.build-and-push.outputs.client_image }}
          DEPLOYED: ${{ needs.deploy-staging.outputs.deployed || 'false' }}
          PUBLIC_CHECK: ${{ needs.health-check.result }}
        run: |
          {
            echo "## Staging Deployment Summary"
            echo ""
            echo "- Source commit: $SOURCE_SHA"
            echo "- API image: $API_IMAGE"
            echo "- Client image: $CLIENT_IMAGE"
            echo "- Remote deployment verified on its host: $DEPLOYED"
            echo "- Public origin check: $PUBLIC_CHECK"
          } >> "$GITHUB_STEP_SUMMARY"
