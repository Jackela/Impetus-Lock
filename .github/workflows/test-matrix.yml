name: Test Matrix

on:
  push:
    branches: ["main"]
    paths: ["server/**", ".github/workflows/test-matrix.yml"]
  pull_request:
    branches: ["main"]
    paths: ["server/**", ".github/workflows/test-matrix.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_VERSION: "2.5.1"

# Cancel previous runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Matrix testing across supported Python versions.
  #
  # The dimension set is intentionally Python-only: `server/pyproject.toml`
  # declares no `[tool.poetry.extras]`, so the former dependency-extras axis
  # only re-ran the identical `poetry install` twice.
  #
  # 3.11 is deliberate, not a missed 3.12 bump: `server/pyproject.toml` still
  # declares `python = "^3.11"` as the support floor, and the 3.12-only entry
  # point (ci.yml, Dockerfile.prod) cannot prove that floor. 3.12 is the
  # production runtime and is covered here plus in ci.yml.
  #
  # Overlap with ci.yml is intentional, not duplication to prune:
  # - 3.12 here re-runs the backend suite that ci.yml gates on, so a break
  #   confined to the interpreter used in production is attributed to this
  #   workflow too (and `paths` keeps it off frontend-only PRs).
  # - 3.11 is the support floor: nothing else in CI runs on it, so removing
  #   this leg would silently drop the pyproject `^3.11` guarantee.
  # Keep both legs.
  test-matrix:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local/share/pypoetry
          key: ${{ runner.os }}-poetry-py${{ matrix.python-version }}-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short -n auto -m "not e2e" --cov=server --cov-report=xml --junitxml=junit-matrix.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_REDIS_TESTS: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: server/junit-matrix.xml
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: server/coverage.xml
          retention-days: 7
