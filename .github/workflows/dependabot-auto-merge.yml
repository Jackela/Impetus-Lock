name: Dependabot Auto-Merge

# Automatically merge Dependabot PRs that pass CI
# Uses GitHub's built-in merge queue for safety
#
# pull_request_target (not pull_request): workflows triggered by
# dependabot[bot] pull requests receive a restricted read-only GITHUB_TOKEN
# ("Secret source: Dependabot") that cannot list other workflows' check runs,
# which made wait-on-check see zero checks on every Dependabot PR. The
# pull_request_target trigger runs in the base-repo context with a full
# GITHUB_TOKEN. This workflow executes no pull-request code (no checkout step;
# gh operates on PR numbers only), so the usual pull_request_target
# code-execution concern does not apply.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for required checks
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # v1.9.1 matches check_name against ONE exact name (no comma-splitting);
          # use a regexp to wait on all four required contexts together.
          check-regexp: '^(Backend Tests|Frontend Tests|(Lint|Type Check) \(Backend \+ Frontend\))$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          checks-discovery-timeout: 600
          allowed-conclusions: success,skipped

      - name: Enable auto-merge for patch/minor updates
        if: |
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          # No approval step: this repository requires zero approving reviews,
          # and "GitHub Actions is not permitted to approve pull requests" is
          # intentionally left enabled (anti-self-approval default).
          gh pr merge "$PR_URL" --auto --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Comment on major updates
        if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major version update detected**

          This PR contains a major version update that requires manual review.

          Please:
          1. Review the breaking changes in the release notes
          2. Test thoroughly in a staging environment
          3. Update documentation if needed

          Do not auto-merge this PR."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Separate job for E2E tests (they take longer)
  auto-merge-e2e:
    name: Auto-merge after E2E tests
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: auto-merge

    steps:
      - name: Wait for E2E tests
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: "Playwright E2E Tests"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          checks-discovery-timeout: 600
          allowed-conclusions: success,skipped
