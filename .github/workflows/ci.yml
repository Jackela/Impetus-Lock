name: CI

# Single PR/push gate for the repository.
#
# `ci-client.yml` and `ci-server.yml` used to run the same suites again on every
# PR (duplicated queue time and duplicated failure noise). They are now
# `workflow_dispatch`-only debug entry points; their unique steps (client build,
# `poetry build`) were folded in here. Branch protection requires the job names
# below, so do not rename them.
#
# Python: 3.12 everywhere (matches server/Dockerfile.prod). The declared
# support floor is still ^3.11 in server/pyproject.toml; that floor is covered
# by test-matrix.yml, not by this gate.
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to run CI on"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Concurrency: Cancel previous runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Backend + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Debug information
        run: |
          echo "🔍 Workflow: ${{ github.workflow }}"
          echo "🔍 Actor: ${{ github.actor }}"
          echo "🔍 Event: ${{ github.event_name }}"
          echo "🔍 Ref: ${{ github.ref }}"
          echo "🔍 SHA: ${{ github.sha }}"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          node --version || true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      # Backend lint
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: ./server
        run: poetry install

      - name: Run Ruff check
        working-directory: ./server
        run: poetry run ruff check .

      - name: Run pydocstyle (Docstring Guard)
        working-directory: ./server
        run: poetry run pydocstyle server/

      - name: Run Ruff format check
        working-directory: ./server
        run: poetry run ruff format --check

      - name: Run import-linter (Architecture Guard)
        working-directory: ./server
        run: poetry run lint-imports

      # Frontend lint
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint

      - name: Run Prettier check
        working-directory: ./client
        run: npm run format

  type-check:
    name: Type Check (Backend + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: type-check"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          node --version || true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      # Backend type check
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: ./server
        run: poetry install

      - name: Run mypy
        working-directory: ./server
        run: poetry run mypy .

      # Frontend type check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run TypeScript type check
        working-directory: ./client
        run: npm run type-check

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: backend-tests"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          poetry --version || true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        working-directory: ./server
        run: |
          poetry install

      - name: Run pytest
        working-directory: ./server
        run: poetry run pytest tests/ --cov=server --cov-report=term-missing -v -n auto --tb=short || (echo "::error::Tests failed" && exit 1)
        env:
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_REDIS_TESTS: "1"

      - name: Report lock-critical line coverage
        working-directory: ./server
        run: poetry run coverage report --rcfile=coverage-critical.ini

      - name: Enforce per-file lock-critical line coverage
        working-directory: ./server
        run: poetry run python check_critical_coverage.py

      # Carried over from ci-server.yml (now dispatch-only): packaging must not
      # regress silently.
      - name: Build backend package
        working-directory: ./server
        run: poetry build

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC # Force UTC timezone for consistent date formatting in snapshots
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: frontend-tests"
          echo "🔍 OS: ${{ runner.os }}"
          node --version || true
          npm --version || true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: ./client
        run: npm run test -- --coverage

      # Carried over from ci-client.yml (now dispatch-only): keep the production
      # build gate on PRs.
      - name: Build production bundle
        working-directory: ./client
        run: npm run build

  # Non-executable contracts: generated API types must match the server schema,
  # and the OpenSpec corpus must stay strictly valid.
  validate:
    name: Validate (API Types + OpenSpec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Check generated API types are up to date
        working-directory: ./client
        run: npm run api:check

      # Pinned to the CLI version used by the repository docs
      # (docs/maintenance/muse-loki-stories.md); `latest` would make the gate
      # non-deterministic.
      - name: Validate OpenSpec corpus (strict)
        run: >-
          npm exec --yes --package=@fission-ai/openspec@1.16.1 --
          openspec validate --all --strict --no-interactive

