name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to run CI on"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Concurrency: Cancel previous runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Backend + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Debug information
        run: |
          echo "🔍 Workflow: ${{ github.workflow }}"
          echo "🔍 Actor: ${{ github.actor }}"
          echo "🔍 Event: ${{ github.event_name }}"
          echo "🔍 Ref: ${{ github.ref }}"
          echo "🔍 SHA: ${{ github.sha }}"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          node --version || true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      # Backend lint
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: ./server
        run: poetry install

      - name: Run Ruff check
        working-directory: ./server
        run: poetry run ruff check .

      - name: Run pydocstyle (Docstring Guard)
        working-directory: ./server
        run: poetry run pydocstyle server/

      - name: Run Ruff format check
        working-directory: ./server
        run: poetry run ruff format --check

      - name: Run import-linter (Architecture Guard)
        working-directory: ./server
        run: poetry run lint-imports

      # Frontend lint
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint

      - name: Run Prettier check
        working-directory: ./client
        run: npm run format

  type-check:
    name: Type Check (Backend + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: type-check"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          node --version || true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      # Backend type check
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: ./server
        run: poetry install

      - name: Run mypy
        working-directory: ./server
        run: poetry run mypy . --no-site-packages --ignore-missing-imports

      # Frontend type check
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run TypeScript type check
        working-directory: ./client
        run: npm run type-check

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: backend-tests"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          poetry --version || true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        working-directory: ./server
        run: |
          poetry install

      - name: Run pytest
        working-directory: ./server
        run: poetry run pytest tests/ --cov=server --cov-report=term-missing -v -n auto --tb=short || (echo "::error::Tests failed" && exit 1)
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Report lock-critical line coverage
        working-directory: ./server
        run: poetry run coverage report --rcfile=coverage-critical.ini

      - name: Enforce per-file lock-critical line coverage
        working-directory: ./server
        run: poetry run python check_critical_coverage.py

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC # Force UTC timezone for consistent date formatting in snapshots
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: frontend-tests"
          echo "🔍 OS: ${{ runner.os }}"
          node --version || true
          npm --version || true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: ./client
        run: npm run test -- --coverage
