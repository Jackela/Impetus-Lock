name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to run CI on"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Concurrency: Cancel previous runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Backend + Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Debug information
        run: |
          echo "🔍 Workflow: ${{ github.workflow }}"
          echo "🔍 Actor: ${{ github.actor }}"
          echo "🔍 Event: ${{ github.event_name }}"
          echo "🔍 Ref: ${{ github.ref }}"
          echo "🔍 SHA: ${{ github.sha }}"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          node --version || true

      - uses: actions/checkout@v6

      # Backend lint
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: ./server
        run: poetry install

      - name: Run Ruff check
        working-directory: ./server
        run: poetry run ruff check .

      - name: Run Ruff format check
        working-directory: ./server
        run: poetry run ruff format --check

      - name: Run import-linter (Architecture Guard)
        working-directory: ./server
        run: poetry run lint-imports

      # Frontend lint
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint

      - name: Run Prettier check
        working-directory: ./client
        run: npm run format

  type-check:
    name: Type Check (Backend + Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: type-check"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          node --version || true

      - uses: actions/checkout@v6

      # Backend type check
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: ./server
        run: poetry install

      - name: Run mypy
        working-directory: ./server
        run: poetry run mypy . --no-site-packages --ignore-missing-imports

      # Frontend type check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run TypeScript type check
        working-directory: ./client
        run: npm run type-check

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: backend-tests"
          echo "🔍 OS: ${{ runner.os }}"
          python3 --version || true
          poetry --version || true

      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          pipx install poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        working-directory: ./server
        run: |
          pip install google-generativeai
          poetry install

      - name: Run pytest
        working-directory: ./server
        run: poetry run pytest tests/ -v -n auto --tb=short --timeout=120

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    env:
      TZ: UTC # Force UTC timezone for consistent date formatting in snapshots
    steps:
      - name: Debug information
        run: |
          echo "🔍 Job: frontend-tests"
          echo "🔍 OS: ${{ runner.os }}"
          node --version || true
          npm --version || true

      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: ./client
        run: npm run test -- --passWithNoTests
