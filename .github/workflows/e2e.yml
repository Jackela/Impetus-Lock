name: E2E Tests

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to run E2E tests on"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_VERSION: "2.5.1"

# PRs supersede their own earlier runs (Playwright is the slowest gate and its
# results are stale as soon as the branch moves). `main` never cancels: every
# merged commit must get its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: ./

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: impetus_lock_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6
        if: ${{ env.ACT != 'true' }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${POETRY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}/server
        run: poetry install

      - name: Run database migrations
        if: ${{ env.ACT != 'true' }}
        working-directory: ${{ github.workspace }}/server
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/impetus_lock_test
        run: |
          echo "Running Alembic migrations..."
          poetry run alembic upgrade head
          echo "✅ Migrations complete"

      - name: Start backend server
        env:
          TESTING: "1"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/impetus_lock_test
          LLM_ALLOW_DEBUG_PROVIDER: "1"
          LLM_DEFAULT_PROVIDER: debug
        run: |
          # Start backend in background with nohup to prevent it from dying
          nohup poetry -C server run python -m uvicorn server.api.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          echo "Waiting for backend to be ready..."

          # Wait for basic health endpoint
          for i in {1..15}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Backend /health endpoint is responding"
              break
            fi
            if ! ps -p $BACKEND_PID > /dev/null 2>&1; then
              echo "❌ Backend process died! Logs:"
              tail -50 /tmp/backend.log
              exit 1
            fi
            echo "Waiting for /health... ($i/15)"
            sleep 2
          done

          # Verify /health endpoint actually works
          if ! curl -f http://localhost:8000/health > /dev/null 2>&1; then
            echo "❌ Backend /health failed. Logs:"
            tail -50 /tmp/backend.log
            exit 1
          fi

          # Now wait for database to be ready (critical for tests)
          echo "Waiting for database connection..."
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health/db | python -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("is_healthy") is True else 1)'; then
              echo "✅ Database is connected!"
              break
            fi
            echo "Waiting for /health/db... ($i/15)"
            sleep 2
          done

          # Final verification
          echo "=== Backend startup complete ==="
          echo "Health check:"
          curl -s http://localhost:8000/health
          echo ""
          echo "Database check:"
          curl -fsS http://localhost:8000/health/db | python -c 'import json, sys; data=json.load(sys.stdin); print(data); sys.exit(0 if data.get("is_healthy") is True else 1)'
          echo ""

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/client
        run: npm ci

      # Browser binaries are keyed on the locked Playwright package. No
      # `restore-keys` fallback on purpose: a stale browser build would be
      # restored for a bumped Playwright and every test would fail on a
      # protocol mismatch.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      - name: Install the browser matching the locked Playwright package
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/client
        run: npx playwright install --with-deps chromium

      # Cached browsers still need the OS libraries (apt packages are not part
      # of the cache), so the deps step runs on every hit.
      - name: Install OS dependencies for the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ${{ github.workspace }}/client
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E tests
        working-directory: ${{ github.workspace }}/client
        env:
          VITE_API_URL: http://localhost:8000
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/impetus_lock_test
        run: npm run test:e2e:ci

      # The HTML/JSON report directory also carries the JUnit XML emitted by the
      # CI reporter configuration; keeping the explicit glob makes sure the
      # machine-readable result survives even if the reporter output path moves.
      - name: Upload Playwright report
        if: ${{ env.ACT != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/junit.xml
            client/test-results/junit*.xml
          retention-days: 30
          if-no-files-found: warn

      # Traces/screenshots/videos only exist for failing tests, so this artifact
      # is failure-scoped to keep successful runs lean.
      - name: Upload Playwright failure evidence
        if: ${{ env.ACT != 'true' && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 7
          if-no-files-found: warn

  story-e2e:
    name: Muse/Loki Story E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: impetus_lock_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/impetus_lock_test

    steps:
      - uses: actions/checkout@v6
        if: ${{ env.ACT != 'true' }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install "poetry==${POETRY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}/server
        run: poetry install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ github.workspace }}/client
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      - name: Install Chromium for the locked Playwright package
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/client
        run: npx playwright install --with-deps chromium

      - name: Install OS dependencies for the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ${{ github.workspace }}/client
        run: npx playwright install-deps chromium

      - name: Run Muse/Loki story with real cookie auth
        working-directory: ${{ github.workspace }}
        run: server/.venv/bin/python scripts/run-story-e2e.py

      - name: Upload story evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: story-e2e-evidence
          path: client/test-results/story/
          retention-days: 30
