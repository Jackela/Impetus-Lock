name: E2E Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to run E2E tests on"
        required: false
        default: "main"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: impetus_lock_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v6
        if: ${{ env.ACT != 'true' }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}/server
        run: poetry install

      - name: Run database migrations
        if: ${{ env.ACT != 'true' }}
        working-directory: ${{ github.workspace }}/server
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/impetus_lock_test
        run: |
          echo "Running Alembic migrations..."
          poetry run alembic upgrade head
          echo "✅ Migrations complete"

      - name: Start backend server
        env:
          TESTING: "true"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/impetus_lock_test
          LLM_ALLOW_DEBUG_PROVIDER: "1"
          LLM_DEFAULT_PROVIDER: debug
        run: |
          # Start backend in background with nohup to prevent it from dying
          nohup poetry -C server run python -m uvicorn server.api.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          echo "Waiting for backend to be ready..."

          # Wait for basic health endpoint
          for i in {1..15}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Backend /health endpoint is responding"
              break
            fi
            if ! ps -p $BACKEND_PID > /dev/null 2>&1; then
              echo "❌ Backend process died! Logs:"
              tail -50 /tmp/backend.log
              exit 1
            fi
            echo "Waiting for /health... ($i/15)"
            sleep 2
          done

          # Verify /health endpoint actually works
          if ! curl -f http://localhost:8000/health > /dev/null 2>&1; then
            echo "❌ Backend /health failed. Logs:"
            tail -50 /tmp/backend.log
            exit 1
          fi

          # Now wait for database to be ready (critical for tests)
          echo "Waiting for database connection..."
          for i in {1..15}; do
            DB_STATUS=$(curl -s http://localhost:8000/health/db 2>/dev/null | grep -o '"status":"ok"' || true)
            if [ -n "$DB_STATUS" ]; then
              echo "✅ Database is connected!"
              break
            fi
            echo "Waiting for /health/db... ($i/15)"
            sleep 2
          done

          # Final verification
          echo "=== Backend startup complete ==="
          echo "Health check:"
          curl -s http://localhost:8000/health
          echo ""
          echo "Database check:"
          curl -s http://localhost:8000/health/db
          echo ""

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/client
        run: npm ci

      - name: Verify Playwright version compatibility
        working-directory: ${{ github.workspace }}/client
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']" | sed 's/[^0-9.]//g')
          INSTALLED_VERSION=$(npx playwright --version | grep -oP '\d+\.\d+\.\d+' | head -1)
          echo "📦 package.json version: $PACKAGE_VERSION"
          echo "🐳 Docker image version: $INSTALLED_VERSION"
          if [ "$PACKAGE_VERSION" != "$INSTALLED_VERSION" ]; then
            echo "❌ Version mismatch detected!"
            echo "Please update .github/workflows/e2e.yml Docker image to: mcr.microsoft.com/playwright:v${PACKAGE_VERSION}-noble"
            exit 1
          fi
          echo "✅ Versions match!"

      - name: Run Playwright E2E tests
        working-directory: ${{ github.workspace }}/client
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: ${{ env.ACT != 'true' && always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30
